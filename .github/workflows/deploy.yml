name: Frontend Build and Deploy to Home Server

on:
  push:
    branches: ['master'] # master 브랜치에 push/merge 시 실행

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1단계: 소스 코드 다운로드
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2단계: GHCR 로그인
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3단계: Docker 이미지 빌드 및 GHCR 업로드
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 📌 docker-compose.yml의 frontend-app 이미지명과 완벽히 일치
          tags: |
            ghcr.io/nowandrun/my-frontend:latest
          build-args: |
            REACT_APP_GRAPHQL_URI=${{ secrets.GRAPHQL_URI }}
            REACT_APP_YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            REACT_APP_YOUTUBE_CHANNEL_ID=${{ secrets.YOUTUBE_CHANNEL_ID }}
            REACT_APP_YOUTUBE_SUNDAYPLAYLIST_ID=${{ secrets.YOUTUBE_SUNDAYPLAYLIST_ID }}
            REACT_APP_YOUTUBE_FRIDAYPLAYLIST_ID=${{ secrets.YOUTUBE_FRIDAYPLAYLIST_ID }}
            REACT_APP_YOUTUBE_SPECIAL_PRAISE_ID=${{ secrets.YOUTUBE_SPECIAL_PRAISE_ID }}
            REACT_APP_YOUTUBE_WEDNESDAY_PRAISE_ID=${{ secrets.YOUTUBE_WEDNESDAY_PRAISE_ID }}
            REACT_APP_YOUTUBE_SUNDAY_PRAISE_ID=${{ secrets.YOUTUBE_SUNDAY_PRAISE_ID }}
            REACT_APP_YOUTUBE_YOUTH_WORSHIP_ID=${{ secrets.YOUTUBE_YOUTH_WORSHIP_ID }}
            REACT_APP_KAKAO_MAP_KEY=${{ secrets.KAKAO_MAP_KEY }}
            GRAPHQL_SCHEMA_URL=${{ secrets.GRAPHQL_SCHEMA_URL }}

      # 4단계: 홈서버 SSH 접속 후 원격 배포
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: 22
          envs: GHCR_PAT, GITHUB_ACTOR
          script: |
            cd /home/wavenexus/outsourcing/gwanghyewon-full-gospel-church

            # 1. GHCR 로그인 (환경변수로 전달받은 GHCR_PAT 사용)
            echo "$GHCR_PAT" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            # 2. docker-compose.yml의 frontend-app 서비스만 핀포인트로 최신 다운로드
            docker compose pull frontend-app

            # 3. 변경된 frontend-app 컨테이너만 강제 재생성 (백엔드/DB는 끊기지 않음)
            docker compose up -d --force-recreate frontend-app

            # 4. 사용하지 않는 구버전 이미지 정리
            docker image prune -f
